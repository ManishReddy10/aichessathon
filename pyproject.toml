[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "numba==0.67.0",
    "torch==2.13.0",
    "onnxruntime==1.29.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
strict = true
files = ["agent.py", "bitboard.py", "engine.py", "harness"]

# numba compiles these per call-site from the actual argument types, so a Python
# annotation neither constrains nor documents them -- every kernel parameter is
# "whatever numpy array numba specialised on". Everything else stays strict, and
# the Python-facing wrappers in both modules are annotated normally.
[[tool.mypy.overrides]]
module = ["bitboard", "engine"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
